<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Karaoke</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .room-card { cursor: pointer; transition: 0.3s; }
        .room-empty { background-color: #d1e7dd; border-color: #badbcc; }
        .room-busy { background-color: #f8d7da; border-color: #f5c2c7; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" id="brand-title" href="#">Karaoke Management</a>
        <div>
            <a href="admin.html" class="btn btn-outline-light btn-sm">Trang Quản Trị</a>
        </div>
    </nav>

    <div class="container my-4">
        <h3 class="mb-3">Sơ Đồ Phòng Hát</h3>
        <div class="row" id="room-list">
            <!-- Danh sách phòng render bằng JS -->
        </div>
    </div>

    <!-- Modal Đặt Phòng -->
    <div class="modal fade" id="bookModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Đặt Phòng: <span id="modal-room-name"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="book-room-id">
                    <div class="mb-3">
                        <label>Hình thức đặt:</label>
                        <select id="book-type" class="form-select" onchange="toggleCustomerInfo()">
                            <option value="counter">Đặt tại quầy</option>
                            <option value="online">Đặt Online</option>
                        </select>
                    </div>
                    <div id="customer-info" style="display:none;">
                        <div class="mb-3"><label>Họ tên:</label><input type="text" id="c-name" class="form-control"></div>
                        <div class="mb-3"><label>Số điện thoại:</label><input type="text" id="c-phone" class="form-control"></div>
                        <div class="mb-3"><label>CCCD:</label><input type="text" id="c-cccd" class="form-control"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="submitBooking()">Xác Nhận Đặt Phòng</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadSettings() {
            const res = await fetch('/api/settings');
            const data = await res.json();
            if(data.name) document.getElementById('brand-title').innerText = data.name;
        }

        async function loadRooms() {
            const res = await fetch('/api/rooms');
            const rooms = await res.json();
            const container = document.getElementById('room-list');
            container.innerHTML = '';

            rooms.forEach(room => {
                const isBusy = room.status !== 'Trống';
                const cardClass = isBusy ? 'room-busy' : 'room-empty';
                
                let html = `
                    <div class="col-md-3 mb-3">
                        <div class="card room-card ${cardClass} p-3" onclick="handleRoomClick(${room.id}, '${room.status}', '${room.room_name}')">
                            <h5>${room.room_name}</h5>
                            <p class="mb-1">Đơn giá: ${room.price_per_hour.toLocaleString()}đ/h</p>
                            <hr class="my-1">
                            <p class="mb-0"><strong>Trạng thái:</strong> ${room.status}</p>
                `;
                if(isBusy) {
                    html += `<small class="text-danger">Khách: ${room.customer_name} (${room.customer_phone})</small>`;
                }
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        function handleRoomClick(id, status, name) {
            if(status === 'Trống') {
                document.getElementById('book-room-id').value = id;
                document.getElementById('modal-room-name').innerText = name;
                new bootstrap.Modal(document.getElementById('bookModal')).show();
            } else {
                if(confirm(`Phòng ${name} đang có khách. Bạn có muốn tính tiền và thanh toán không?`)) {
                    checkoutRoom(id);
                }
            }
        }

        function toggleCustomerInfo() {
            const type = document.getElementById('book-type').value;
            document.getElementById('customer-info').style.display = type === 'online' ? 'block' : 'none';
        }

        async function submitBooking() {
            const room_id = document.getElementById('book-room-id').value;
            const type = document.getElementById('book-type').value;
            const customer_name = document.getElementById('c-name').value;
            const customer_phone = document.getElementById('c-phone').value;
            const customer_cccd = document.getElementById('c-cccd').value;

            await fetch('/api/rooms/book', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room_id, type, customer_name, customer_phone, customer_cccd })
            });

            location.reload();
        }

        async function checkoutRoom(room_id) {
            const res = await fetch('/api/rooms/checkout', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room_id })
            });
            const data = await res.json();
            if(data.success) {
                alert(`--- HÓA ĐƠN THANH TOÁN ---\nPhòng: ${data.report.room_name}\nThời gian: ${data.report.hours} giờ\nTiền phòng: ${data.report.roomTotal}đ\nTiền dịch vụ: ${data.report.serviceTotal}đ\n--------------------\nTỔNG CỘNG: ${data.report.grandTotal}đ`);
                location.reload();
            }
        }

        loadSettings();
        loadRooms();
    </script>
</body>
</html>
